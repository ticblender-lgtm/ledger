services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_PATH: /app/data/ledger.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      # Persist SQLite only — never mount over /app or the binary is wiped.
      - sqlite_data:/app/data
    # Coolify proxy reaches the container port; do NOT bind host ports
    # (avoids "port is already allocated" on 8080/3000).
    expose:
      - "8080"
    networks:
      - ledger-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Must be the public URL of the API (browser-reachable), not Docker DNS.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ledger-net

volumes:
  sqlite_data:

networks:
  ledger-net:
    driver: bridge
